name = "Enhanced First Aid Kits"
prefix = "efak"
author = "Miss Heda"
mainprefix = "z"

[files]
include = [
    "mod.cpp",
    "logo.paa",
    "README.md",
]

[version]
git_hash = 0

[hemtt.config]
preset = "Hemtt"

# Mods loaded alongside for testing. hemtt launch already sets -skipIntro -noSplash
# -showScriptErrors -debug and file patching by itself.
#
# Anything specific to your machine - an Arma profile, a custom mod folder - goes on the
# command line rather than in here, so the repo stays the same for everyone:
#
#   hemtt launch -- -name="Your Profile"
[hemtt.launch]
workshop = [
    "450814997",  # CBA_A3
    "463939057",  # ACE3
    "1779063631", # Zeus Enhanced
    "2369477168", # Advanced Developer Tools
    # "3316254084", # ACM - Advanced Combat Medical
    "3749759934", # ACME
    # "3800798331" # ACME DEV
]

# A development mission that opens the kit window straight away, in a window rather than full screen:
#
#   hemtt launch ui-test
[hemtt.launch.ui-test]
workshop = [
    "450814997",  # CBA_A3
    "463939057",  # ACE3
    "2369477168", # Advanced Developer Tools
]
mission = "EFAK_UITest.VR"
parameters = ["-window"]

# Pictures for the workshop page: a medical scene on Altis and keys that open each window, see
# .hemtt/missions/EFAK_Screenshots.Altis/initPlayerLocal.sqf. Take them with Windows HDR off.
#
#   hemtt launch screenshots
[hemtt.launch.screenshots]
workshop = [
    "450814997",  # CBA_A3
    "463939057",  # ACE3
    "3749759934", # ACME
]
mission = "EFAK_Screenshots.Altis"
parameters = ["-window"]

# The same without ACM Extended from the workshop, to test a local build of it instead - `hemtt build`
# in the ACM-Extended repo first, then:
#
#   hemtt launch local-acme -- "-mod=<ACM-Extended repo>/.hemttout/build"
[hemtt.launch.local-acme]
workshop = [
    "450814997",  # CBA_A3
    "463939057",  # ACE3
    "1779063631", # Zeus Enhanced
    "2369477168", # Advanced Developer Tools
]
